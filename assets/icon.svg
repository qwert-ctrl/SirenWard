<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b63b0"/>
      <stop offset="0.55" stop-color="#173f78"/>
      <stop offset="1" stop-color="#0a2347"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.08" r="0.75">
      <stop offset="0" stop-color="#ffd27a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dce8f7"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc85c"/>
      <stop offset="1" stop-color="#e99a24"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fa3e0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#4fa3e0" stop-opacity="0.15"/>
    </linearGradient>
    <clipPath id="squircle"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>
  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#sea)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
    <!-- Sirenen-Gesang: Bögen, die vor dem Segel abbrechen -->
    <g fill="none" stroke="#9fd0ff" stroke-linecap="round">
      <path d="M 238 300 A 150 150 0 0 1 238 520" stroke-width="22" stroke-opacity="0.55"/>
      <path d="M 300 330 A 110 110 0 0 1 300 490" stroke-width="22" stroke-opacity="0.35"/>
      <path d="M 352 362 A 70 70 0 0 1 352 458" stroke-width="22" stroke-opacity="0.2"/>
    </g>
    <!-- Mast -->
    <rect x="500" y="228" width="26" height="470" rx="13" fill="#ffffff"/>
    <!-- Großsegel, vom Wind gebläht -->
    <path d="M 538 250 C 650 330, 712 470, 716 640 L 538 640 Z" fill="url(#sail)"/>
    <!-- Vorsegel -->
    <path d="M 488 300 C 430 400, 412 520, 418 640 L 488 640 Z" fill="#ffffff" fill-opacity="0.82"/>
    <!-- Rumpf -->
    <path d="M 330 668 L 742 668 C 726 742, 664 778, 590 778 L 470 778 C 402 778, 348 742, 330 668 Z" fill="url(#hull)"/>
    <!-- Wellen -->
    <path d="M 100 812 C 190 772, 270 772, 360 812 S 530 852, 620 812 S 790 772, 924 812 L 924 924 L 100 924 Z" fill="url(#wave)"/>
    <path d="M 100 860 C 200 828, 290 828, 390 860 S 570 892, 660 860 S 830 828, 924 860 L 924 924 L 100 924 Z" fill="#0a2347" fill-opacity="0.55"/>
  </g>
  <!-- feine Kante wie bei macOS-Icons -->
  <rect x="100.5" y="100.5" width="823" height="823" rx="185" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
</svg>
